<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChaloChale - Booking</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body class="min-vh-100 d-flex flex-column">
    <div class="container home-page flex-grow-1 d-flex flex-column">
        <div class="row">
            <div class="col-md-12">
                <!-- Navbar Start -->
                <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
                    <div class="container-fluid">
                        <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                            data-bs-target="#navbarTogglerDemo01" aria-controls="navbarTogglerDemo01"
                            aria-expanded="false" aria-label="Toggle navigation">
                            <span class="navbar-toggler-icon"></span>
                        </button>
                        <div class="collapse navbar-collapse" id="navbarTogglerDemo01">
                            <a class="navbar-brand text-primary fw-bold" href="#">ChaloChale</a>
                            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                                <li class="nav-item"><a class="nav-link active text-white" href="#">Home</a></li>
                                <li class="nav-item"><a class="nav-link text-white" href="#">Destinations</a></li>
                                <li class="nav-item"><a class="nav-link text-white" href="#">Packages</a></li>
                                <li class="nav-item"><a class="nav-link text-white" href="#">Booking</a></li>
                                <li class="nav-item"><a class="nav-link text-white" href="#">Contact</a></li>
                            </ul>
                            <div class="d-flex gap-2">
                                <a class="btn btn-warning" href="signup.html">SignUP</a>
                                <a class="btn btn-warning" href="signin.html">SignIn</a>
                            </div>
                        </div>
                    </div>
                </nav>
                <!-- Navbar Ends -->
            </div>
        </div>

        <main class="flex-grow-1 py-4">
            <section class="card shadow-sm" aria-labelledby="bookingFormTitle">
                <div class="card-header bg-white py-3">
                    <h1 class="h4 mb-0" id="bookingFormTitle">Book Your Trip</h1>
                </div>

                <form>
                    <div class="card-body p-4">
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label for="fullName" class="form-label">Full Name</label>
                                <input type="text" class="form-control" id="fullName" name="fullname"
                                    placeholder="Enter your full name" required>
                            </div>

                            <div class="col-md-6">
                                <label for="bookingEmail" class="form-label">Email</label>
                                <input type="email" class="form-control" id="bookingEmail" name="email"
                                    placeholder="Enter your email" required>
                            </div>

                            <div class="col-md-6">
                                <label for="bookingPassword" class="form-label">Password</label>
                                <input type="password" class="form-control" id="bookingPassword"
                                    name="password" placeholder="Enter your password" required>
                            </div>

                            <div class="col-md-6">
                                <label for="travelDate" class="form-label">Travel Date</label>
                                <input type="date" class="form-control" id="travelDate" name="travelDate"
                                    required>
                            </div>

                            <div class="col-12">
                                <label for="peopleCount" class="form-label">Number of People</label>
                                <input type="number" class="form-control" id="peopleCount" name="people"
                                    placeholder="Enter number of people" min="1" required>
                            </div>

                            <div class="col-12">
                                <label for="bookingMessage" class="form-label">Message</label>
                                <textarea class="form-control" id="bookingMessage" name="message" rows="3"
                                    placeholder="Tell us about your trip"></textarea>
                                <div class="form-text">Be sure to include relevant details.</div>
                            </div>
                        </div>
                    </div>

                    <div class="card-footer bg-white d-flex justify-content-end gap-2 py-3">
                        <button type="reset" class="btn btn-secondary">Cancel</button>
                        <button type="submit" class="btn btn-success">Submit Booking Request</button>
                    </div>
                </form>
            </section>
        </main>

        <footer class="bg-dark text-white text-center py-3 mt-auto">
            <p class="mb-0">© 2026 ChaloChale Travel App || Designed with Bootstrap.</p>
        </footer>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
